function paper(studio=false){return `<div class="paper"><div class="kop" ${studio?'style="outline:1px dashed #22677b"':''}><b>YAYASAN PENDIDIKAN NUSANTARA</b><h2>MTs NUSANTARA</h2><span>Jl. Pendidikan No. 10 · Kabupaten Bandung Barat</span></div><h2>BERITA ACARA PELAKSANAAN</h2><div style="text-align:center;margin-bottom:18px">SUMATIF AKHIR SEMESTER GANJIL<br>TAHUN PELAJARAN 2026/2027</div><p>Pada hari Senin, 30 November 2026 telah dilaksanakan ujian dengan rincian sebagai berikut:</p><div style="margin:14px 0">Hari / tanggal : ${studio?'<b style="background:#dce9ee">{{tanggal_ujian}}</b>':'Senin, 30 November 2026'}<br>Mata pelajaran : Bahasa Indonesia<br>Ruang : ${studio?'<b style="background:#dce9ee">{{nama_ruangan}}</b>':'Ruang 01'}<br>Jumlah peserta : 20</div><table><thead><tr><th>Hadir</th><th>Tidak hadir</th><th>Jumlah</th></tr></thead><tbody><tr><td>20</td><td>0</td><td>20</td></tr></tbody></table><p style="margin-top:16px">Catatan: Ujian berlangsung tertib dan lancar.</p><div class="sign">Pengawas ruang<br><br><br><u>Ahmad Fauzi</u></div></div>`}function component(title,markup,desc){return `<section class="panel component"><div class="panelhead"><h2>${title}</h2></div><div class="panelbody">${markup}<p>${desc}</p></div></section>`}function setMaster(t){masterTab=t;go('master')}function setRoom(n){room=n;selectedDesk=null;seatOverrides={};go('seating')}function selectDesk(i){if(selectedDesk===null){selectedDesk=i;go('seating')}else{let a=selectedDesk,b=i;let va=seatOverrides[a]??a,vb=seatOverrides[b]??b;seatOverrides[a]=vb;seatOverrides[b]=va;selectedDesk=null;go('seating');toast('Kursi ditukar pada pratinjau; data tidak disimpan')}}$('brandmark').innerHTML=I('list');$('hamb').innerHTML=I('menu');$('theme').innerHTML=I('moon');$('help').innerHTML=I('help');go(location.hash.slice(1)||'dashboard');
</script></body></html>
