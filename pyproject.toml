[project]
name = "ujian-cerdas"
version = "0.1.0"
description = "Aplikasi desktop administrasi ujian offline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.20.1",
    "docxtpl==0.20.2",
    "openpyxl==3.1.5",
    "ortools==9.15.6755",
    "pillow==13.0.0",
    "platformdirs==4.14.8",
    "pydantic==2.14.4",
    "python-docx==1.2.0",
    "pywebview==6.2.1",
    "reportlab==5.1.0",
    "segno==1.6.6",
    "sqlalchemy==2.1.9",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pyinstaller==6.22.3",
    "pytest==9.2.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
