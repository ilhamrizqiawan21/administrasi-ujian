name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint & format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy)
        run: uv run mypy app backend tests
      - name: Run tests (pytest)
        run: uv run pytest -v
      - name: Headless self-test
        run: uv run python -m app.main --self-test
      - name: Verify no DB or secret files committed
        run: |
          if git ls-files | grep -E '\.(sqlite|sqlite3|db|env|key|pem|lic)$'; then
            echo "Forbidden data/secret file tracked in git!"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Test (vitest)
        run: npm run test
      - name: Build (vite)
        run: npm run build

  windows-smoke:
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install backend & run Windows self-test
        run: |
          uv sync --frozen
          uv run pytest -v
          uv run python -m app.main --self-test
